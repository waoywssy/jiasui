    <!-- Open Graph Meta标签 -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="湖南嘉遂安全科技有限公司">
    <meta property="og:locale" content="zh_CN">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Schema.org 结构化数据 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "首页",
          "item": "https://www.jiasui-safety.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "公示信息",
          "item": "https://www.jiasui-safety.com/#announcements"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "详情"
        }
      ]
    }
    </script>
</head>
<body>
    <!-- 公示详情 -->
    <main>
        <section class="announcement-detail-section">
            <div class="container">
                <!-- 面包屑导航 -->
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <span>首页</span>
                    <span class="separator">/</span>
                    <span>公示信息</span>
                    <span class="separator">/</span>
                    <span class="current" id="breadcrumbTitle">详情</span>
                </nav>

            <!-- 详情内容 -->
            <article class="announcement-detail" id="announcementDetail">
                <header class="detail-header">
                    <span class="category-badge" id="categoryBadge"></span>
                    <h1 class="detail-title" id="detailTitle"></h1>
                    <div class="detail-meta">
                        <span class="meta-item">
                            <i class="fas fa-calendar-alt"></i>
                            <span id="detailDate"></span>
                        </span>
                        <span class="meta-item">
                            <i class="fas fa-user"></i>
                            <span id="detailAuthor"></span>
                        </span>
                    </div>
                </header>

                <div class="detail-content" id="detailContent">
                    <!-- 内容将通过JavaScript动态加载 -->
                </div>

                <div class="detail-attachments" id="detailAttachments">
                    <!-- 附件列表将通过JavaScript动态生成 -->
                </div>
            </article>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <div class="footer-logo">
                        <img src="images/logo/logo1.png" alt="嘉遂安全科技">
                        <span>湖南嘉遂安全科技有限公司</span>
                    </div>
                    <p>专业安全管理解决方案提供商</p>
                </div>
                <div class="footer-section">
                    <h4>快速链接</h4>
                    <ul class="footer-links">
                        <li><a href="index.html#home">首页</a></li>
                        <li><a href="index.html#about">关于我们</a></li>
                        <li><a href="index.html#services">主要业务</a></li>
                        <li><a href="index.html#announcements">公示信息</a></li>
                        <li><a href="index.html#contact">联系我们</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>联系方式</h4>
                    <ul class="footer-contact">
                        <li><i class="fas fa-phone"></i> 17775765957</li>
                        <li><i class="fas fa-envelope"></i> 2429904498@qq.com</li>
                        <li><i class="fas fa-map-marker-alt"></i> 湖南省长沙市</li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 湖南嘉遂安全科技有限公司. All Rights Reserved. |
                    <a href="https://beian.miit.gov.cn/">备案号：湘ICP备2025140740号</a>
                </p>
            </div>
        </div>
    </footer>

    <script src="announcements-data.js" defer></script>
    <script src="announcement-detail.js" defer></script>
</body>
</html>
