<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 - 湖南嘉遂安全科技有限公司</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 404页面特定样式 */
        .error-404 {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            position: relative;
            overflow: hidden;
        }

        .error-404::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(52, 152, 219, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(52, 152, 219, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(52, 152, 219, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        .error-container {
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .error-code {
            font-size: 12rem;
            font-weight: 900;
            color: #3498db;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(52, 152, 219, 0.1);
            animation: float 3s ease-in-out infinite;
        }

        .error-message {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .error-description {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .error-btn.primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
        }

        .error-btn.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(52, 152, 219, 0.4);
        }

        .error-btn.secondary {
            background: rgba(255, 255, 255, 0.8);
            color: #2c3e50;
            border: 2px solid rgba(52, 152, 219, 0.2);
            backdrop-filter: blur(10px);
        }

        .error-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .error-icon {
            font-size: 4rem;
            color: #3498db;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        .error-suggestions {
            margin-top: 60px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(52, 152, 219, 0.1);
        }

        .suggestions-title {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .suggestions-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            color: #555;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(52, 152, 219, 0.1);
        }

        .suggestion-item:hover {
            background: rgba(52, 152, 219, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.2);
            color: #3498db;
        }

        .suggestion-item i {
            color: #3498db;
            font-size: 14px;
        }

        /* 动画效果 */
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .error-code {
                font-size: 8rem;
            }
            
            .error-message {
                font-size: 1.3rem;
            }
            
            .error-description {
                font-size: 1rem;
            }
            
            .error-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .error-btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
            
            .suggestions-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 6rem;
            }
            
            .error-message {
                font-size: 1.1rem;
            }
            
            .error-container {
                padding: 20px 15px;
            }
            
            .error-suggestions {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 404错误页面 -->
    <div class="error-404">
        <div class="error-container">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            
            <div class="error-code">404</div>
            
            <h1 class="error-message">页面未找到</h1>
            
            <p class="error-description">
                抱歉，您访问的页面不存在或已被移除。<br>
                请检查URL是否正确，或返回首页重新浏览。
            </p>
            
            <div class="error-actions">
                <a href="/" class="error-btn primary">
                    <i class="fas fa-home"></i>
                    返回首页
                </a>
                <a href="javascript:history.back()" class="error-btn secondary">
                    <i class="fas fa-arrow-left"></i>
                    返回上页
                </a>
            </div>
            
            <div class="error-suggestions">
                <h3 class="suggestions-title">您可能想要访问：</h3>
                <ul class="suggestions-list">
                    <li>
                        <a href="/" class="suggestion-item">
                            <i class="fas fa-home"></i>
                            <span>首页</span>
                        </a>
                    </li>
                    <li>
                        <a href="/#about" class="suggestion-item">
                            <i class="fas fa-info-circle"></i>
                            <span>关于我们</span>
                        </a>
                    </li>
                    <li>
                        <a href="/#services" class="suggestion-item">
                            <i class="fas fa-briefcase"></i>
                            <span>主要业务</span>
                        </a>
                    </li>
                    <li>
                        <a href="/#contact" class="suggestion-item">
                            <i class="fas fa-phone"></i>
                            <span>联系我们</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.error-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.6s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });

        // 自动重定向功能（可选）
        let redirectTimeout;
        
        function startRedirectTimer() {
            redirectTimeout = setTimeout(() => {
                if (confirm('页面将在5秒后自动跳转到首页，是否立即跳转？')) {
                    window.location.href = '/';
                }
            }, 10000); // 10秒后提示
        }

        // 页面失去焦点时启动计时器，获得焦点时清除
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                startRedirectTimer();
            } else {
                clearTimeout(redirectTimeout);
            }
        });

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                window.location.href = '/';
            }
            if (e.key === 'Backspace' && !e.target.matches('input, textarea')) {
                window.history.back();
            }
        });
    </script>
</body>
</html>
